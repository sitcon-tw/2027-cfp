name: Build CFP site

# Builds the site for sitcon.org/2027/cfp/ and publishes it to the `build`
# branch, then triggers sitcon-tw/2027's "Deploy website" workflow, which
# copies that branch into its GitHub Pages output. The trigger needs the
# DEPLOY_DISPATCH_TOKEN secret: a fine-grained token with Actions read and
# write on sitcon-tw/2027 (the default GITHUB_TOKEN can't reach other repos).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfp-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish
    if: github.ref == 'refs/heads/main' && github.repository == 'sitcon-tw/2027-cfp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      # Runs `tsc -b` before `vite build`, so this also typechecks.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /2027/cfp/
          # Repository variables (Settings → Secrets and variables →
          # Actions → Variables). Without the API URL the form is a mock.
          VITE_SUBMISSION_API: ${{ vars.SUBMISSION_API }}
          # Public site key of the Turnstile widget the API checks.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Publish to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: build
          publish_dir: ./dist

      - name: Trigger sitcon-tw/2027 deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy.yml --repo sitcon-tw/2027 --ref main
          echo "Built CFP source $GITHUB_SHA and triggered the sitcon-tw/2027 \"Deploy website\" workflow to publish it." >> "$GITHUB_STEP_SUMMARY"
