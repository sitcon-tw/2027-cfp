engineStrict: true

# Matches pnpm 10, which skipped these build scripts; nothing needs them.
allowBuilds:
  esbuild: false
  workerd: false
  protobufjs: false
  # Its own script downloads the latest binary; the root postinstall pins it.
  cn-font-split: false
  # vite-plugin-font: loads cn-font-split's native binary.
  koffi: true
